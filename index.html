<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>البركة</title>
<style>
:root{--bg:#0a0907;--card:#17130d;--line:#3a2f1a;--gold:#c9a45c;--gold2:#e6c988;--txt:#f3ead8;--mut:#a39880;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0907}}
:root[data-theme="dark"]{--bg:#0a0907}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:90px}
header{text-align:center;padding:14px 12px 6px}
header img{width:170px;max-width:60%;height:auto;border-radius:14px}
.sub{color:var(--mut);font-size:14px;margin:4px 0 0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);z-index:5}
.tab{flex:none;border:1px solid var(--line);background:none;color:var(--txt);padding:8px 16px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.tab.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:14px 12px;max-width:900px;margin:auto}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.em{font-size:44px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;background:#0f0c08;border-radius:10px}
.ph{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:#fff;display:block}
.p h3{margin:0;font-size:16px}
.p .u{color:var(--mut);font-size:13px}
.price{color:var(--gold2);font-weight:700;font-size:18px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
button{font:inherit;cursor:pointer}
.add{background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold2);font-size:18px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.bar button{width:100%;background:var(--gold);color:#1a1405;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;display:flex;justify-content:space-between}
.bar button:disabled{opacity:.4}
.wa{position:fixed;left:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#25d366;color:#06310f;border-radius:999px;padding:11px 16px;text-decoration:none;font-weight:700;z-index:6;font-size:14px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:none}
.ov.show{display:block}
.in{max-width:560px;margin:auto}
h2{color:var(--gold2);margin:8px 0 12px}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font:inherit}
.pay{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;color:var(--txt);font-size:15px}
.pay input{width:auto;margin-top:4px}
.pay small{display:block;color:var(--mut)}
.tot{font-size:19px;font-weight:700;margin:14px 0;display:flex;justify-content:space-between}
.send{width:100%;background:#25d366;color:#06310f;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700}
.back{background:none;border:0;color:var(--gold2);font-size:15px;padding:6px 0}
.err{color:#ff8b7a;font-size:14px;min-height:18px}
</style>
</head>

var cat=0,cart={};
var $=function(i){return document.getElementById(i)};
function money(n){return n+" ج.م"}
function tabs(){$("tabs").innerHTML=CATS.map(function(t,i){return '<button class="tab'+(i==cat?' on':'')+'" role="tab" data-c="'+i+'">'+t+'</button>'}).join("")}
function grid(){$("grid").innerHTML=ITEMS.filter(function(x){return x.c==cat}).map(function(x){
var q=cart[x.id]||0;
var ctl=q?'<div class="qty"><button data-m="'+x.id+'" aria-label="نقّص">−</button><b>'+q+'</b><button data-a="'+x.id+'" aria-label="زوّد">+</button></div>':'<button class="add" data-a="'+x.id+'">أضف</button>';
return '<div class="p">'+(x.img?'<img class="ph" src="'+x.img+'" alt="">':'<div class="em">'+x.e+'</div>')+'<h3>'+x.n+'</h3><span class="u">'+x.u+'</span><div class="row"><span class="price">'+money(x.p)+'</span>'+ctl+'</div></div>'}).join("")}
function total(){var t=0,n=0;ITEMS.forEach(function(x){var q=cart[x.id]||0;t+=q*x.p;n+=q});return{t:t,n:n}}
function bar(){var s=total();$("open").disabled=!s.n;$("cnt").textContent=s.n?("السلة ("+s.n+")"):"السلة فاضية";$("sum").textContent=s.n?money(s.t):""}
function lines(){var s=total();$("lines").innerHTML=ITEMS.filter(function(x){return cart[x.id]}).map(function(x){
return '<div class="line"><span>'+x.n+'<br><small style="color:var(--mut)">'+money(x.p)+' / '+x.u+'</small></span><div class="qty"><button data-m="'+x.id+'" aria-label="نقّص">−</button><b>'+cart[x.id]+'</b><button data-a="'+x.id+'" aria-label="زوّد">+</button></div></div>'}).join("");
$("tot").textContent=money(s.t);if(!s.n)$("ov").classList.remove("show")}
function refresh(){grid();bar();if($("ov").classList.contains("show"))lines()}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.c!==undefined){cat=+b.dataset.c;tabs();grid()}
else if(b.dataset.a){cart[b.dataset.a]=(cart[b.dataset.a]||0)+1;refresh()}
else if(b.dataset.m){var k=b.dataset.m;cart[k]=(cart[k]||1)-1;if(cart[k]<1)delete cart[k];refresh()}});
$("open").onclick=function(){lines();$("ov").classList.add("show");window.scrollTo(0,0)};
$("back").onclick=function(){$("ov").classList.remove("show")};
$("vf").textContent="حوّل على: "+CFG.vodafone+" وابعت صورة التحويل في الواتساب";
$("ip").textContent="حوّل على: "+CFG.instapay+" وابعت صورة التحويل في الواتساب";
$("chat").href="https://wa.me/"+CFG.wa+"?text="+encodeURIComponent("السلام عليكم، عندي استفسار عن البركة");
$("send").onclick=function(){
var s=total(),nm=$("nm").value.trim(),ph=$("ph").value.trim(),ad=$("ad").value.trim();
if(!s.n){$("err").textContent="السلة فاضية.";return}
if(!nm||!ph||!ad){$("err").textContent="اكتب الاسم والموبايل والعنوان علشان نوصّل لك.";return}
$("err").textContent="";
var pay=document.querySelector('input[name="pay"]:checked').value;
var m="طلب جديد من البركة\n\n"+ITEMS.filter(function(x){return cart[x.id]}).map(function(x){return "• "+x.n+" × "+cart[x.id]+" = "+money(cart[x.id]*x.p)}).join("\n")+
"\n\nالإجمالي: "+money(s.t)+"\nالدفع: "+pay+"\nالاسم: "+nm+"\nالموبايل: "+ph+"\nالعنوان (المقطم): "+ad+($("nt").value.trim()?"\nملاحظات: "+$("nt").value.trim():"");
window.open("https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(m),"_blank")};
tabs();grid();bar();
</script>
